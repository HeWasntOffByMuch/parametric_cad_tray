name: Deploy API to the VPS

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/tray-core/**'
      - 'deploy/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'packages/api/**'
      - 'packages/tray-core/**'
      - 'deploy/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: an interrupted
# `docker compose up` leaves the VPS between two images.
concurrency:
  group: api-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  test:
    name: Geometry core and API suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - name: Install the pinned runtime
        run: |
          python -m pip install --upgrade pip
          # The same pins the image is built from, so a suite that passes here
          # passes for the same reasons in the container.
          pip install -r deploy/requirements.txt
          pip install pytest httpx
      - name: The system libraries the OCP wheel does not vendor
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libx11-6 libexpat1
      - name: Core suite
        run: python -m pytest packages/tray-core/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/tray-core
      - name: API suite
        run: python -m pytest packages/api/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/tray-core:${{ github.workspace }}/packages/api

  # --------------------------------------------------------------------------
  build:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image name
        id: meta
        # GHCR rejects an uppercase path, and this repository owner has capitals.
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # A pull request builds to prove the Dockerfile still works, and
          # pushes nothing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # The OCP wheel is ~400 MB and the apt layer is stable; without this
          # every run re-downloads both.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # --------------------------------------------------------------------------
  deploy:
    name: Roll it out
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.TRAYMOLD_API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the deployment is configured
        # Through the environment, never interpolated into the script: a secret
        # substituted into a shell line is a secret the shell can be made to run.
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          DOMAIN: ${{ vars.TRAYMOLD_API_DOMAIN }}
          ORIGINS: ${{ vars.TRAYAPI_ALLOWED_ORIGINS }}
          TLS_EMAIL: ${{ vars.TRAYMOLD_TLS_EMAIL }}
          PROXY: ${{ vars.TRAYMOLD_PROXY }}
        run: |
          missing=()
          [ -n "$HOST" ]     || missing+=("secret VPS_HOST")
          [ -n "$USER_" ]    || missing+=("secret VPS_USER")
          [ -n "$KEY" ]      || missing+=("secret VPS_SSH_KEY")
          [ -n "$DOMAIN" ]   || missing+=("variable TRAYMOLD_API_DOMAIN")
          [ -n "$ORIGINS" ]  || missing+=("variable TRAYAPI_ALLOWED_ORIGINS")
          # Only the bundled proxy needs an ACME address; with an external one
          # the certificate is not ours to get. Caddy's global `email` option
          # refuses an empty value, so an unset variable in caddy mode would fail
          # on the VPS rather than in this job.
          if [ "${PROXY:-caddy}" = "caddy" ]; then
            [ -n "$TLS_EMAIL" ] || missing+=("variable TRAYMOLD_TLS_EMAIL")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Not configured yet. Missing:\n'; printf '  - %s\n' "${missing[@]}"
            printf '\nSee docs/deployment.md.\n'
            exit 1
          fi

      - name: Authorize against the VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use. Fine for a host you control, but pin it:
            #   ssh-keyscan -p 22 your.vps > key.txt
            # and paste the result into the VPS_SSH_HOST_KEY repository variable.
            echo "::warning::VPS_SSH_HOST_KEY is not set; falling back to ssh-keyscan (no host verification)."
            ssh-keyscan -p "${PORT:-22}" "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Write the environment file
        env:
          DOMAIN: ${{ vars.TRAYMOLD_API_DOMAIN }}
          TLS_EMAIL: ${{ vars.TRAYMOLD_TLS_EMAIL }}
          ORIGINS: ${{ vars.TRAYAPI_ALLOWED_ORIGINS }}
          WORKERS: ${{ vars.TRAYAPI_WORKERS }}
          MEMORY: ${{ vars.TRAYMOLD_MEMORY_LIMIT }}
          IMAGE: ${{ needs.build.outputs.image }}
          PROXY: ${{ vars.TRAYMOLD_PROXY }}
          API_BIND: ${{ vars.TRAYMOLD_API_BIND }}
          PROXY_NETWORK: ${{ vars.TRAYMOLD_PROXY_NETWORK }}
          ANALYTICS_DB: ${{ vars.TRAYMOLD_ANALYTICS_DB }}
        run: |
          # Pinned to this commit, not to :latest, so the VPS runs exactly what
          # this run built and a rollback is re-running an older workflow.
          cat > deploy/.env <<EOF
          TRAYMOLD_IMAGE=${IMAGE}:${{ github.sha }}
          TRAYMOLD_SITE_ADDRESS=${DOMAIN}
          TRAYMOLD_TLS_EMAIL=${TLS_EMAIL}
          TRAYAPI_ALLOWED_ORIGINS=${ORIGINS}
          TRAYAPI_WORKERS=${WORKERS:-2}
          TRAYMOLD_MEMORY_LIMIT=${MEMORY:-3g}
          TRAYMOLD_API_BIND=${API_BIND:-127.0.0.1:8000}
          TRAYMOLD_PROXY_NETWORK=${PROXY_NETWORK}
          EOF

          # A repository variable cannot be distinguished from an empty one, so
          # analytics is on by default (compose supplies the path in its own
          # volume) and the variable exists to move the file or to switch it off.
          case "${ANALYTICS_DB}" in
            "")            echo "analytics: on, default path" ;;
            off|none|"0")  echo 'TRAYMOLD_ANALYTICS_DB=' >> deploy/.env
                           echo "analytics: off (TRAYMOLD_ANALYTICS_DB=${ANALYTICS_DB})" ;;
            *)             echo "TRAYMOLD_ANALYTICS_DB=${ANALYTICS_DB}" >> deploy/.env
                           echo "analytics: on, ${ANALYTICS_DB}" ;;
          esac

          rm -f deploy/.env.local

          # A containerised proxy cannot reach a loopback-bound API - inside it,
          # 127.0.0.1 is itself - so it joins the API to the proxy's own network
          # and addresses it as traymold-api:8000.
          files="-f docker-compose.yml"
          if [ -n "$PROXY_NETWORK" ]; then
            files="$files -f docker-compose.proxy-net.yml"
            echo "joining docker network: $PROXY_NETWORK"
          fi
          echo "COMPOSE_FILE_ARGS=$files" >> "$GITHUB_ENV"

          # caddy: run the bundled proxy, which needs 80 and 443 to itself.
          # external: run the API alone on TRAYMOLD_API_BIND and leave TLS to
          # whatever already owns those ports on this host.
          case "${PROXY:-caddy}" in
            caddy)    echo "COMPOSE_PROFILE_ARGS=--profile caddy" >> "$GITHUB_ENV" ;;
            external) echo "COMPOSE_PROFILE_ARGS=" >> "$GITHUB_ENV" ;;
            *) echo "::error::TRAYMOLD_PROXY must be 'caddy' or 'external', not '$PROXY'"; exit 1 ;;
          esac
          echo "proxy mode: ${PROXY:-caddy}"

      - name: Ship the compose files
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${PORT:-22} $USER@$HOST"

          # Default into the deploy user's own home. /opt is the conventional
          # place for this, but it is root-owned, and the deploy user is
          # deliberately not in sudoers - defaulting there makes the first deploy
          # fail on a permission the workflow has no way to acquire.
          if [ -z "${DIR:-}" ]; then
            DIR="$($SSH 'echo "$HOME"')/traymold"
          fi
          echo "deploying to $DIR"
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"

          if ! out="$($SSH "mkdir -p '$DIR'" 2>&1)"; then
            echo "$out"
            echo "::error::Cannot create $DIR as $USER. Either set the VPS_APP_DIR variable to a path this user owns, or on the VPS run: sudo mkdir -p '$DIR' && sudo chown $USER '$DIR'"
            exit 1
          fi

          # tar over ssh rather than rsync or scp -r: tar is on every host, and
          # this ships the deploy directory only, never the repository.
          tar -cz -C deploy . | $SSH "tar -xz -C '$DIR'"

      - name: Pull and restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          PROXY_NETWORK: ${{ vars.TRAYMOLD_PROXY_NETWORK }}
        run: |
          # APP_DIR is resolved once, by the previous step.
          DIR="$APP_DIR"
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${PORT:-22} $USER@$HOST"

          # Piped, so the token never appears in the remote process arguments.
          # (ssh joins its command arguments into one string, so the username
          # goes in directly; a GitHub login name has no shell metacharacters.)
          printf '%s' "$GHCR_TOKEN" \
            | $SSH "docker login ghcr.io -u ${GHCR_USER} --password-stdin"

          if [ -n "${PROXY_NETWORK:-}" ] \
             && ! $SSH "docker network inspect '$PROXY_NETWORK'" >/dev/null 2>&1; then
            echo "::error::No docker network named '$PROXY_NETWORK' on the VPS. Run 'docker network ls' there and set TRAYMOLD_PROXY_NETWORK to the network the reverse proxy container is on."
            exit 1
          fi

          # Passed on the command line rather than through the env file, so the
          # active profile is visible in the log and does not depend on how
          # compose resolves COMPOSE_PROFILES from --env-file.
          $SSH bash -s <<EOF
          set -euo pipefail
          cd '$DIR'
          COMPOSE="docker compose $COMPOSE_FILE_ARGS --env-file .env $COMPOSE_PROFILE_ARGS"
          \$COMPOSE pull
          \$COMPOSE up -d --remove-orphans --wait --wait-timeout 240
          docker logout ghcr.io
          # Keep a week of images so a rollback does not have to pull again.
          docker image prune -af --filter 'until=168h'
          \$COMPOSE ps
          EOF

      # Answers the question the public smoke cannot: is the container itself
      # right? Splitting it means a failure below is unambiguously the proxy or
      # the certificate, never the API.
      - name: Check the API answers on the host
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          API_BIND: ${{ vars.TRAYMOLD_API_BIND }}
        run: |
          BIND="${API_BIND:-127.0.0.1:8000}"
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" "$USER@$HOST" \
            "curl -fsS --max-time 15 http://${BIND}/api/health" | python3 -m json.tool

      # Analytics swallows its own failures by design, so an unwritable database
      # is invisible from the public smoke below. It is visible here, and only
      # here: this is the one place that can tell "the volume is not mounted"
      # from "nobody has downloaded anything yet". A warning, never a failure -
      # a counter is not worth failing a deploy over.
      - name: Check the analytics database is writable
        continue-on-error: true
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          cat > /tmp/check-analytics.py <<'PY'
          from trayapi.analytics import db

          if not db.enabled():
              print("analytics disabled")
          else:
              # A read proves the file opened; only a write proves the volume is
              # not read-only and not owned by the wrong uid, which is the whole
              # question. The row is removed in the same transaction.
              conn = db.connect()
              now = db.utcnow()
              with conn:
                  conn.execute(
                      "INSERT OR REPLACE INTO sessions (session_id, visitor_id,"
                      " first_seen_at, last_seen_at, source) VALUES (?,?,?,?,?)",
                      ("deploy-check", "deploy-check", now, now, "direct"))
                  conn.execute("DELETE FROM sessions WHERE session_id='deploy-check'")
              rows = conn.execute("SELECT COUNT(*) FROM qualified_usages").fetchone()[0]
              print(f"analytics ok: {db.database_path()} ({rows} qualified usages)")
          PY

          # The script arrives on stdin, so nothing has to survive two levels of
          # shell quoting.
          if ! out="$(ssh -i "$HOME/.ssh/id_deploy" -p "${PORT:-22}" "$USER@$HOST" \
                 "cd '$APP_DIR' && docker compose $COMPOSE_FILE_ARGS --env-file .env exec -T api python -" \
                 < /tmp/check-analytics.py 2>&1)"; then
            echo "::warning::Could not check the analytics database: $out"
            exit 0
          fi
          echo "$out"
          case "$out" in
            *"analytics ok"*|*"analytics disabled"*) ;;
            *) echo "::warning::The analytics database did not open. Check that the traymold_analytics volume is mounted and writable by uid 10001." ;;
          esac

      - name: Smoke the live deployment
        env:
          DOMAIN: ${{ vars.TRAYMOLD_API_DOMAIN }}
          ORIGINS: ${{ vars.TRAYAPI_ALLOWED_ORIGINS }}
          PROXY: ${{ vars.TRAYMOLD_PROXY }}
          API_BIND: ${{ vars.TRAYMOLD_API_BIND }}
          PROXY_NETWORK: ${{ vars.TRAYMOLD_PROXY_NETWORK }}
        run: |
          base="https://${DOMAIN}"
          # In caddy mode a first deploy is waiting on Let's Encrypt, which can
          # take minutes. In external mode a working proxy answers at once, so a
          # long wait here only delays a diagnosis that is already certain.
          if [ "${PROXY:-caddy}" = "external" ]; then tries=8; else tries=40; fi

          # The status code, not just success or failure: a proxy that cannot be
          # reached at all and one that is forwarding to nothing are different
          # problems with different fixes, and they are told apart here.
          code=000
          for i in $(seq 1 $tries); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$base/api/health" || echo 000)
            [ "$code" = "200" ] && break
            echo "waiting for $base - HTTP $code ($i/$tries)"; sleep 15
          done

          if [ "$code" != "200" ]; then
            case "$code" in
              502|503|504)
                echo "::error::$base answered HTTP $code. The proxy is reaching this host and terminating TLS, but cannot reach the API behind it. With a containerised proxy that means the API is not on its docker network: TRAYMOLD_PROXY_NETWORK is currently '${PROXY_NETWORK:-unset}' - set it to the network the proxy container is on ('docker network ls' on the VPS) so the API joins it as traymold-api:8000. If it is already set, check the upstream address in the proxy's own config."
                ;;
              000)
                if [ "${PROXY:-caddy}" = "external" ]; then
                  echo "::error::$base did not answer at all, and the API is healthy on the VPS at ${API_BIND:-127.0.0.1:8000}. The proxy that owns 443 there has no vhost for $DOMAIN yet, or its certificate is not issued - see 'Behind a proxy you already run' in docs/deployment.md."
                else
                  echo "::error::$base did not answer at all. Caddy has not obtained a certificate: check that $DOMAIN resolves to this VPS and that port 80 is reachable, then read 'docker compose logs caddy' on the host."
                fi
                ;;
              *)
                echo "::error::$base answered HTTP $code rather than 200. Something is serving that hostname, but it is not this API - check which vhost is matching $DOMAIN."
                ;;
            esac
            exit 1
          fi

          ORIGIN="${ORIGINS%%,*}" ./deploy/smoke.sh "$base"
